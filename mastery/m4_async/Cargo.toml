# Mastery module M4: an async runtime from scratch, then a real service.
# A standalone package: not a member of the course's root package, so the
# chapter checks never download or build these crates.
[package]
name = "m4_async"
description = "Mastery module M4: an async runtime from scratch, then a real service"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace]

# Lessons 01 to 08 use the standard library only. Lesson 09 runs the same
# protocol on tokio. Versions are pinned with "=" so that behaviour and
# messages match the tests.
[dependencies]
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# Lesson 09: `CancellationToken`.
tokio-util = "=0.7.20"

[dev-dependencies]
# Paused, virtual time for #[tokio::test(start_paused = true)].
tokio = { version = "=1.54.1", features = ["test-util"] }

[lints.rust]
# Lessons 01, 05 and 06 contain `unsafe`. Inside an unsafe fn every unsafe
# operation still needs its own block, and every block needs a SAFETY comment.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
