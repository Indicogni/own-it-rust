# Mastery module M9: the professional toolbox.
[package]
name = "m9_toolbox"
description = "Mastery module M9: the professional toolbox"
license = "MIT"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# A standalone package: not a member of the root workspace. The directories
# `fixtures/`, `capstone/` and `fuzz/` hold separate projects of their own.
[workspace]
exclude = ["capstone", "fixtures", "fuzz"]

[dependencies]
arbitrary = "=1.5.0"
semver = "=1.0.28"
serde_json = "=1.0.154"
serde_norway = "=0.9.42"
toml = "=1.2.1"

[dev-dependencies]
insta = "=1.49.0"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
