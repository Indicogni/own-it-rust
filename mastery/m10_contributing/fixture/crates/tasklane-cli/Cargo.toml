[package]
name = "tasklane-cli"
description = "The `tasklane` command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tasklane"
path = "src/main.rs"

[dependencies]
# The command line moved to bitflags 2 in 0.4.0 (#19). The library crates have not yet.
bitflags = "=2.13.2"
tasklane-core.workspace = true
tasklane-plugin.workspace = true
