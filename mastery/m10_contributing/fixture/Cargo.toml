# tasklane: a small task runner for text pipelines.
[workspace]
resolver = "3"
members = [
    "crates/tasklane-plugin",
    "crates/tasklane-core",
    "crates/tasklane-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
# Still on the 1.x line; see issues/0019-bitflags-2.md.
bitflags = "=1.3.2"
tasklane-plugin = { path = "crates/tasklane-plugin" }
tasklane-core = { path = "crates/tasklane-core" }
