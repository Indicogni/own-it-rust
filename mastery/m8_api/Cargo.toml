# Mastery module M8: library design, semver and stewardship.
# A standalone package: not a member of the course's root package, so you can
# work on it (and the chapter checks can run) independently.
[package]
name = "m8_api"
description = "Mastery module M8: library design, semver and stewardship"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# The small crates under fixtures/ are packages of their own. The tests build
# them with a second `cargo` or with `rustc`, the way a user of a library does.
[workspace]
exclude = ["fixtures"]

[lib]
# Several lesson files are compiled twice: as a module of this package, and as
# a library crate of their own with a different name. Documentation tests that
# you write in them use the second name, so this package does not run them.
# Lesson 06 runs your documentation tests in its own way.
doctest = false

# Standard library only. If this module ever needs a crate, pin it with "=".
[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
