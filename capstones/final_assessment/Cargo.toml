[package]
name = "cap_final_assessment"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Final assessment: rgx, a regular-expression engine with linear-time matching and a parallel search tool"
default-run = "rgx"

# This package stands alone. The empty table keeps Cargo from attaching it to
# any workspace found in a parent directory.
[workspace]

# The acceptance tests call the few library items that SPEC section 2 lists
# and run the binary `rgx`. Everything else inside `src/` is yours to design.
[lib]
name = "rgx"
path = "src/lib.rs"

[[bin]]
name = "rgx"
path = "src/main.rs"

# The standard library only. This is part of the assessment (SPEC section 9).
[dependencies]
