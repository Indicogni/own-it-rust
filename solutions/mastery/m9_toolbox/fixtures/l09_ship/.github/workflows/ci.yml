name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token this workflow gets can read the repository and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain is pinned, so new lints arrive when we raise this number,
  # in a pull request of their own, and not on a random Tuesday.
  RUST_VERSION: "1.99.0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Documentation builds without warnings
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      # Without --all-targets, this also runs the doc tests.
      - run: cargo test --workspace --all-features --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the minimum supported Rust version
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
