# Lesson 03 fixture. You edit this file, `src/lib.rs`, `rustfmt.toml`, and you create
# `clippy.toml`. Do not edit `src/seeded.rs`.
[package]
name = "invoice"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
# Compiles `src/seeded.rs`, which a test uses to probe your Clippy configuration.
seeded = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# The group gets a lower priority, so the single lints below can override it.
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
# Policy: `#[must_use]` on every getter is noise for this crate.
must_use_candidate = "allow"
