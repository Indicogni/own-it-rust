# Lesson 02 lab. You finish this crate: TODO 1 is in this file, TODO 2 in
# build.rs and TODO 3 in src/lib.rs. The lesson file src/l02_sys_crate.rs of
# the M6 package has the full instructions.
[package]
name = "fletch-sys"
description = "Lesson 02 lab: raw bindings to the vendored fletch C library"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
build = "build.rs"
# One package per `links` name in a dependency graph: Cargo refuses to build
# two packages that both claim `fletch`, so the C symbols cannot collide.
# The key also turns `cargo::metadata=KEY=VALUE` lines of build.rs into
# DEP_FLETCH_KEY variables for the build scripts of direct dependents.
links = "fletch"

[features]
# Also compile and bind the 32-bit checksum (`fletch32`).
wide = []

# Supplied, so that the committed Cargo.lock stays valid.
[build-dependencies]
cc = "=1.11.2"
